[config]
mouse_delay = 16
deadzone_mode = scaled_radial
deadzone_scale = 6
deadzone_x = 2000
deadzone_y = 2000

[controls]
a = "mouse_left"
b = "esc"
x = "mouse_right"
y = "enter"

l1 = "s"
l2 =
r1 = "backspace"
r2 =

start = "esc"
back = hold_state osk
guide =

up = "up"
down = "down"
left = "left"
right = "right"

left_analog = mouse_movement
right_analog =

# Select + D-Pad Down opens/closes the OmniOSK on-screen keyboard (highscore
# name entry). OMNI_TOGGLE_KEY defaults to F12 -- see SDL-Ball.sh. While open:
# D-Pad navigates, Y confirms (OMNI_CONFIRM_KEY default RETURN), R1 deletes
# (OMNI_BACKSPACE_KEY default BACKSPACE). A is mouse_left for gameplay/menu
# clicks, not a real keyboard event, so OmniOSK's own SDL_KEYDOWN-only input
# backend never sees it -- Y/R1 are separate bindings on purpose.
[controls:osk]
overlay = parent
down = "f12"
